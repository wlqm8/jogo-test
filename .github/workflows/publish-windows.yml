name: Publicar jogo para Windows

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar as dependências fixadas no lockfile
        run: npm ci

      - name: Validar o jogo
        run: |
          npm test
          npm run check

      - name: Gerar o executável Windows x64
        run: npm run build:windows

      - name: Publicar o download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -p "'v' + require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "A tag precisa corresponder à versão do package.json."
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Capim & Cia ${tag#v} — Windows" \
              --notes-file docs/RELEASE-WINDOWS.md
          fi
          gh release upload "$tag" \
            release/Capim-e-Cia-Windows-x64.zip \
            release/Capim-e-Cia-Windows-x64.zip.sha256 \
            dist/Capim-e-Cia-Navegador.zip \
            dist/Capim-e-Cia-Navegador.zip.sha256 --clobber
          gh release edit "$tag" --draft=false --latest \
            --target "$GITHUB_SHA" --notes-file docs/RELEASE-WINDOWS.md
